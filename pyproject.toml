[project]
name = "mca-paperwork-helper"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pymupdf (>=2.1,<3.0)",
    "gspread (>=6.2.1,<7.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
black = "^26.10.1"
ruff = "^0.17.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
